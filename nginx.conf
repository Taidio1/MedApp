# Anatomy Studio — Nginx Reverse Proxy

upstream nextjs {
    server web:3000;
}

upstream fastapi {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Maksymalny rozmiar przesyłanych plików (modele 3D mogą być duże)
    client_max_body_size 100M;

    # Timeouty dla długich zapytań AI (Claude może odpowiadać do 30s)
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # /api/* → FastAPI backend (usuwa prefix /api przed przekazaniem)
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /* → Next.js frontend
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support dla Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
