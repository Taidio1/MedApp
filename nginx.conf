# Anatomy Studio - Nginx Reverse Proxy

upstream nextjs {
    server web:3000;
}

upstream fastapi {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Large 3D model uploads.
    client_max_body_size 100M;

    # Long AI requests can take a while.
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # Supabase OAuth can set several large auth-cookie headers on callback.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Public /api/* belongs to Next.js Route Handlers.
    # Next.js proxies AI requests to FastAPI over the internal Docker network.
    location /api/ {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else goes to the Next.js frontend.
    location / {
        proxy_pass http://nextjs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
